<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formative Assessment 1 - Pre-Grade 1</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, sans-serif;
    background: #f0f4f8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px;
  }

  .header {
    width: 100%;
    max-width: 600px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    margin-bottom: 5px;
  }

  .back-btn {
    background: #fff;
    border: 2px solid #2196F3;
    color: #2196F3;
    font-size: 1.2rem;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
  }

  .back-btn:hover { background: #e3f2fd; }

  .header h2 { font-size: 1.3rem; color: #333; margin: 0; }
  .header span { font-size: 0.8rem; color: #666; margin-left: auto; }

  .quiz-area {
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }

  .quiz-audio-btn {
    background: #FF9800;
    color: #fff;
    border: none;
    font-size: 3rem;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(255,152,0,0.4);
    transition: transform 0.1s;
  }

  .quiz-audio-btn:active { transform: scale(0.9); }

  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
    max-width: 400px;
  }

  .option-card {
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    cursor: pointer;
    background: #fff;
    border: 3px solid #ddd;
    overflow: hidden;
    transition: all 0.15s;
  }

  .option-card img { width: 100%; height: 100%; object-fit: cover; }

  .option-card.correct { border-color: #4CAF50; background: #E8F5E9; }
  .option-card.wrong { border-color: #f44336; background: #FFEBEE; }

  .quiz-score { font-size: 1rem; font-weight: bold; color: #333; }

  .quiz-done { text-align: center; }
  .quiz-done h3 { font-size: 1.4rem; margin-bottom: 8px; }
  .quiz-done .pass { color: #4CAF50; }
  .quiz-done .fail { color: #f44336; }

  .retry-btn {
    background: #2196F3;
    color: #fff;
    border: none;
    padding: 12px 28px;
    font-size: 1rem;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 10px;
  }

  .hidden { display: none !important; }

  @media (max-width: 400px) {
    .options-grid { gap: 6px; }
  }
</style>
</head>
<body>

<div class="header">
  <a href="index-tp.html" class="back-btn">← Back</a>
  <h2>Formative Assessment 1</h2>
  <span id="progressDot">Units 1-4</span>
</div>

<div class="quiz-area" id="quizArea">
  <button class="quiz-audio-btn" id="quizAudioBtn" onclick="playQuizAudio()">🔊</button>
  <div class="options-grid" id="optionsGrid"></div>
  <div class="quiz-score" id="quizScore">Score: 0 / 20</div>
</div>

<div class="quiz-done hidden" id="quizDone">
  <h3>Assessment Complete</h3>
  <p id="quizFinalScore" style="font-size: 1.2rem;"></p>
  <p id="passFailText" style="font-weight: bold;"></p>
  <button class="retry-btn" onclick="retryQuiz()">🔄 Try Again</button>
</div>

<script>
// ===== DATA =====
const pool = [
  { name: 'sit-down', topic: 'actions' },
  { name: 'stand-up', topic: 'actions' },
  { name: 'walk', topic: 'actions' },
  { name: 'run', topic: 'actions' },
  { name: 'read', topic: 'actions' },
  { name: 'write', topic: 'actions' },
  { name: 'jump', topic: 'actions' },
  { name: 'clap', topic: 'actions' },
  { name: 'point', topic: 'actions' },
  { name: 'touch', topic: 'actions' },
  { name: 'eleven', topic: 'numbers-11-20' },
  { name: 'twelve', topic: 'numbers-11-20' },
  { name: 'thirteen', topic: 'numbers-11-20' },
  { name: 'fourteen', topic: 'numbers-11-20' },
  { name: 'fifteen', topic: 'numbers-11-20' },
  { name: 'sixteen', topic: 'numbers-11-20' },
  { name: 'seventeen', topic: 'numbers-11-20' },
  { name: 'eighteen', topic: 'numbers-11-20' },
  { name: 'nineteen', topic: 'numbers-11-20' },
  { name: 'twenty', topic: 'numbers-11-20' },
  { name: 'twenty-one', topic: 'numbers-21-100' },
  { name: 'twenty-two', topic: 'numbers-21-100' },
  { name: 'thirty', topic: 'numbers-21-100' },
  { name: 'forty', topic: 'numbers-21-100' },
  { name: 'fifty', topic: 'numbers-21-100' },
  { name: 'sixty', topic: 'numbers-21-100' },
  { name: 'seventy', topic: 'numbers-21-100' },
  { name: 'eighty', topic: 'numbers-21-100' },
  { name: 'ninety', topic: 'numbers-21-100' },
  { name: 'one-hundred', topic: 'numbers-21-100' }
];

const alphabetPool = "abcdefghijklmnopqrstuvwxyz".split("").map(letter => ({
  name: letter,
  topic: 'alphabet-names'
}));

const TOTAL = 20;
const PASS = 15;

let quizItems = [];
let quizIndex = 0;
let quizScore = 0;
let quizLocked = false;

function getAudioPath(topic, name) {
  return topic + '/audio/' + name + '.mp3';
}

function getImgPath(topic, name) {
  return topic + '/img/' + name + '.jpg';
}

function playAudio(topic, name) {
  const audio = new Audio(getAudioPath(topic, name));
  audio.play().catch(e => console.log('Audio:', e));
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQuiz() {
  const alphabet = shuffle(alphabetPool).slice(0, 5);
  const fromPool = shuffle(pool);
  const actions = fromPool.filter(i => i.topic === 'actions').slice(0, 5);
  const num11 = fromPool.filter(i => i.topic === 'numbers-11-20').slice(0, 5);
  const num21 = fromPool.filter(i => i.topic === 'numbers-21-100').slice(0, 5);

  quizItems = shuffle([...actions, ...alphabet, ...num11, ...num21]).map(item => ({ correct: item }));
  quizIndex = 0;
  quizScore = 0;
  quizLocked = false;
}

function getOptions(correctItem) {
  const sameTopic = pool.filter(i => i.topic === correctItem.topic && i.name !== correctItem.name);
  const otherTopics = pool.filter(i => i.topic !== correctItem.topic);
  let wrongs = sameTopic.length >= 3 ? shuffle(sameTopic).slice(0, 3) : shuffle([...sameTopic, ...otherTopics]).slice(0, 3);
  return shuffle([correctItem, ...wrongs]);
}

function renderQuizQuestion() {
  if (quizIndex >= quizItems.length) { showQuizDone(); return; }

  quizLocked = false;
  const q = quizItems[quizIndex];
  const options = getOptions(q.correct);

  const grid = document.getElementById('optionsGrid');
  grid.innerHTML = '';

  options.forEach(opt => {
    const card = document.createElement('div');
    card.className = 'option-card';
    card.innerHTML = '<img src="' + getImgPath(opt.topic, opt.name) + '" alt="">';
    card.onclick = function() { handleOptionClick(card, opt.name === q.correct.name && opt.topic === q.correct.topic); };
    grid.appendChild(card);
  });

  document.getElementById('quizScore').textContent = 'Score: ' + quizScore + ' / ' + TOTAL;
  setTimeout(() => { playAudio(q.correct.topic, q.correct.name); }, 300);
}

function handleOptionClick(card, isCorrect) {
  if (quizLocked) return;
  quizLocked = true;

  if (isCorrect) {
    card.classList.add('correct');
    quizScore++;
  } else {
    card.classList.add('wrong');
    const allCards = document.querySelectorAll('.option-card');
    const correctName = quizItems[quizIndex].correct.name;
    const correctTopic = quizItems[quizIndex].correct.topic;
    allCards.forEach(c => {
      const img = c.querySelector('img');
      if (img && img.src.includes(correctTopic + '/img/' + correctName + '.jpg')) {
        c.classList.add('correct');
      }
    });
  }

  document.getElementById('quizScore').textContent = 'Score: ' + quizScore + ' / ' + TOTAL;
  setTimeout(() => { quizIndex++; renderQuizQuestion(); }, 1200);
}

function playQuizAudio() {
  if (quizIndex < quizItems.length) {
    playAudio(quizItems[quizIndex].correct.topic, quizItems[quizIndex].correct.name);
  }
}

function showQuizDone() {
  document.getElementById('quizArea').classList.add('hidden');
  document.getElementById('quizDone').classList.remove('hidden');

  const passed = quizScore >= PASS;
  document.getElementById('quizFinalScore').textContent = 'Your score: ' + quizScore + ' / ' + TOTAL;
  const passFail = document.getElementById('passFailText');
  if (passed) {
    passFail.textContent = '✅ PASSED! Continue to Unit 5.';
    passFail.className = 'pass';
  } else {
    passFail.textContent = '❌ NOT YET. Review and try again.';
    passFail.className = 'fail';
  }

  const data = { bestScore: quizScore, total: TOTAL, passingScore: PASS, lastAttempt: new Date().toISOString() };
  const existing = localStorage.getItem('tpr-formative-1-progress');
  if (existing) {
    const prev = JSON.parse(existing);
    if (prev.bestScore > quizScore) data.bestScore = prev.bestScore;
  }
  localStorage.setItem('tpr-formative-1-progress', JSON.stringify(data));
}

function retryQuiz() {
  document.getElementById('quizDone').classList.add('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  buildQuiz();
  renderQuizQuestion();
}

// Init
buildQuiz();
renderQuizQuestion();
</script>
</body>
</html>
