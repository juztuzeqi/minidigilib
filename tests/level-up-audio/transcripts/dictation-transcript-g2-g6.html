<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Dictation Transcripts G2-G6</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
            background: #d0e2f2;
            padding: 20px 12px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 550px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 10px 30px rgba(0, 30, 60, 0.2);
            padding: 24px 20px 30px;
        }
        h1 {
            font-size: 1.8rem;
            color: #0b3b5a;
            text-align: center;
            margin-bottom: 5px;
        }
        .badge {
            background: #f4a261;
            font-size: 0.7rem;
            padding: 4px 12px;
            border-radius: 30px;
            color: white;
            display: inline-block;
            margin-left: 8px;
            vertical-align: middle;
        }
        .sub {
            text-align: center;
            color: #34675c;
            margin-bottom: 25px;
            font-size: 0.85rem;
        }
        .pdf-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin: 20px 0;
        }
        .pdf-row {
            background: #f5faff;
            border-radius: 20px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            border: 1px solid #c0d6ed;
        }
        .pdf-label {
            font-size: 1.2rem;
            font-weight: 700;
            color: #0a3147;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .pdf-label span {
            font-size: 1.5rem;
        }
        .pdf-btn {
            background: #1d5b8e;
            border: none;
            padding: 10px 28px;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .pdf-btn:active {
            background: #0f4370;
            transform: scale(0.98);
        }
        .pdf-btn.download {
            background: #f4a261;
        }
        .pdf-btn.download:active {
            background: #e08e3a;
        }
        .back-link {
            display: block;
            margin: 30px auto 10px;
            text-align: center;
            text-decoration: none;
            font-size: 1rem;
            padding: 12px;
            background: #ffffff;
            border-radius: 50px;
            width: 80%;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            color: #1d5b8e;
            font-weight: 600;
            border: 1px solid #c0d6ed;
        }
        .back-link:active {
            background: #e9ecef;
        }
        .note {
            text-align: center;
            font-size: 0.7rem;
            color: #8aacc9;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📄 Dictation <span class="badge">Transcripts</span></h1>
    <div class="sub">Download PDF transcripts for each grade</div>

    <div class="pdf-list">
        <!-- Grade 2 -->
        <div class="pdf-row">
            <div class="pdf-label">
                <span>📘</span> Grade 2
            </div>
            <a href="G2-transcript.pdf" class="pdf-btn download" download>
                ⬇ Download PDF
            </a>
        </div>

        <!-- Grade 3 -->
        <div class="pdf-row">
            <div class="pdf-label">
                <span>📗</span> Grade 3
            </div>
            <a href="G3-transcript.pdf" class="pdf-btn download" download>
                ⬇ Download PDF
            </a>
        </div>

        <!-- Grade 4 -->
        <div class="pdf-row">
            <div class="pdf-label">
                <span>📙</span> Grade 4
            </div>
            <a href="G4-transcript.pdf" class="pdf-btn download" download>
                ⬇ Download PDF
            </a>
        </div>

        <!-- Grade 5 -->
        <div class="pdf-row">
            <div class="pdf-label">
                <span>📕</span> Grade 5
            </div>
            <a href="G5-transcript.pdf" class="pdf-btn download" download>
                ⬇ Download PDF
            </a>
        </div>

        <!-- Grade 6 -->
        <div class="pdf-row">
            <div class="pdf-label">
                <span>📒</span> Grade 6
            </div>
            <a href="G6-transcript.pdf" class="pdf-btn download" download>
                ⬇ Download PDF
            </a>
        </div>
    </div>

    <a class="back-link" href="../../index-lu.html">⬅ Back to Audio</a>
    <div class="note">📁 All PDF files are in the transcripts folder</div>
</div>
</body>
</html>
