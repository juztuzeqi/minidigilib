<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>G3 English Program Monthly Assessment 4</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #d0e2f2; font-family: 'Segoe UI', Roboto, sans-serif; padding: 10px 8px; display: flex; justify-content: center; }
        .paper { max-width: 750px; width: 100%; background: white; border-radius: 28px; box-shadow: 0 8px 25px rgba(0,30,60,0.2); padding: 18px 14px; }
        h1 { font-size: 1.7rem; color: #123b54; margin: 0 0 2px 5px; }
        .sub { font-size: 0.9rem; color: #34675c; margin-left: 8px; margin-bottom: 15px; }
        .score-panel { background: #e2edfb; border-radius: 40px; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; justify-content: space-between; margin-bottom: 20px; scroll-margin-top: 20px; }
        .score-item { background: white; border-radius: 30px; padding: 4px 14px; font-weight: 600; font-size: 0.9rem; color: #114b66; box-shadow: 0 1px 4px #b0c8dd; }
        .part { background: #f5faff; border-radius: 24px; padding: 18px 12px 22px; margin: 25px 0 18px; border: 1px solid #c0d6ed; }
        .part h2 { background: #205882; color: white; display: inline-block; padding: 5px 24px; border-radius: 40px; font-size: 1.3rem; margin-top: -34px; margin-bottom: 16px; }
        .grid-a { display: flex; flex-direction: column; gap: 12px; }
        .qcard { background: white; border-radius: 18px; padding: 12px 14px; border: 1px solid #d0e2f5; font-size: 0.95rem; }
        .qnum { font-weight: 700; color: #003f66; margin-right: 5px; }
        .stem { line-height: 1.4; }
        .ops { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px; }
        .ops label { background: #ecf3fc; padding: 4px 14px; border-radius: 30px; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
        .fb { margin-left: 8px; font-weight: 600; font-size: 0.9rem; }
        .fb.correct { color: #1f8b4c; }
        .fb.wrong { color: #c13a3a; }
        .fill-block { background: #fffcf0; border-radius: 24px; padding: 18px 16px; margin: 15px 0 10px; border: 2px solid #c0b28b; }
        .fill-item { margin: 20px 0; display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
        .fill-item .qnum { font-weight: 700; color: #003f66; min-width: 40px; font-size: 1rem; line-height: 1.5; flex-shrink: 0; }
        .fill-content { flex: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; line-height: 1.5; }
        .inline-input { display: inline-block; width: 140px; flex-shrink: 0; }
        .inline-input input, .inline-input select { width: 100%; padding: 8px 12px; border: 2px solid #5f8bb3; border-radius: 30px; font-size: 0.9rem; text-align: center; background: white; }
        .inline-input input.correct, .inline-input select.correct { background: #e3f7e3; border-color: #2a7f4a; }
        .inline-input input.wrong, .inline-input select.wrong { background: #ffe6e6; border-color: #c13a3a; }
        .fill-feedback { font-weight: 700; font-size: 0.9rem; min-width: 80px; text-align: center; flex-shrink: 0; }
        .fill-feedback.correct { color: #1f8b4c; }
        .fill-feedback.wrong { color: #c13a3a; }
        .check-bottom { display: flex; justify-content: center; margin: 20px 0 8px; gap: 12px; flex-wrap: wrap; }
        .btn-large { background: #1e4e73; color: white; border: none; padding: 14px 30px; border-radius: 60px; font-size: 1.3rem; font-weight: 700; width: 100%; max-width: 300px; cursor: pointer; }
        .btn-small { background: white; border: 1px solid #2c6085; padding: 6px 16px; border-radius: 40px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
        .section-title { font-weight: 600; margin: 20px 0 10px; font-size: 1.1rem; color: #205882; }
    </style>
</head>
<body>
<div class="paper">
    <h1>📘 G3 Monthly Assessment 4</h1>
    <div class="sub">English Program | Grammar &amp; Vocabulary</div>

    <div class="score-panel" id="scorePanel">
        <span class="score-item">A <span id="scoreA">0</span>/20</span>
        <span class="score-item">B <span id="scoreB">0</span>/10</span>
        <span class="score-item">total <span id="scoreTotal">0</span>/30</span>
        <button class="btn-small" id="resetBtn">↺ Reset</button>
    </div>

    <!-- ===================== PART A ===================== -->
    <div class="part">
        <h2>🔹 PART A: Grammar</h2>

        <!-- A.1 Multiple Choice (10 soal) -->
        <div class="section-title">A.1 Multiple Choice</div>
        <div class="grid-a" id="partAMC"></div>

        <!-- A.2 Adjectives (10 soal) -->
        <div class="section-title" style="margin-top:25px;">A.2 Adjectives</div>
        <div class="fill-block" id="a2Container"></div>
    </div>

    <!-- ===================== PART B ===================== -->
    <div class="part">
        <h2>🔸 PART B: Exercise</h2>

        <!-- B.1 Antonyms (10 soal) -->
        <div class="section-title">B.1 Antonyms</div>
        <div class="grid-a" id="b1Container"></div>
    </div>

    <div class="check-bottom">
        <button class="btn-large" id="checkBtn">🔍 Check Answers</button>
    </div>
</div>

<script>
    (function() {

        // ========== A.1 MULTIPLE CHOICE (10) ==========
        const mcqs = [
            { stem: "I ______ when the phone rang.", opts: ["listened", "was listening", "listen", "am listening"], correct: 1 },
            { stem: "My parents ______ when the rain started.", opts: ["slept", "were sleeping", "sleep", "are sleeping"], correct: 1 },
            { stem: "She ______ on the street when she saw her friend.", opts: ["walked", "walks", "was walking", "is walking"], correct: 2 },
            { stem: "We ______ twelve years old next year.", opts: ["are", "were", "will be", "was"], correct: 2 },
            { stem: "She ______ for us tonight.", opts: ["sings", "sang", "singing", "will sing"], correct: 3 },
            { stem: "We always ______ our teeth before bed.", opts: ["brushed", "brush", "brushing", "will brush"], correct: 1 },
            { stem: "Brian didn't ______ his parents about his English test score last week.", opts: ["told", "telling", "tell", "tells"], correct: 2 },
            { stem: "She speaks ______.", opts: ["clear", "clearly", "clearing", "clearest"], correct: 1 },
            { stem: "The fairy godmother asked the little boy \"Why are you sad?\" ______.", opts: ["kind", "kindness", "kindly", "kinder"], correct: 2 },
            { stem: "It is raining ______. We cannot go out.", opts: ["heavy", "heavily", "heavier", "heaviest"], correct: 1 }
        ];

        // ========== A.2 ADJECTIVES (10) ==========
        const a2Items = [
            { before: "The children do not like the", after: "oranges.", options: ["sweet", "sour", "fat"], correct: "sour" },
            { before: "The", after: "teacher punished the naughty boy.", options: ["timid", "angry", "lazy"], correct: "angry" },
            { before: "The", after: "man can't run fast. He is panting.", options: ["thin", "fat", "loud"], correct: "fat" },
            { before: "The", after: "room belongs to John.", options: ["ugly", "untidy", "noisy"], correct: "untidy" },
            { before: "Don't play with the", after: "knife.", options: ["blunt", "sharp", "thick"], correct: "sharp" },
            { before: "The man puts on a jacket. He is feeling", after: ".", options: ["cold", "warm", "hungry"], correct: "cold" },
            { before: "Mary wants some food. She is", after: ".", options: ["thirsty", "hungry", "full"], correct: "hungry" },
            { before: "The children are laughing. They must be", after: ".", options: ["loud", "happy", "cruel"], correct: "happy" },
            { before: "Joni is crying, he must be", after: ".", options: ["loud", "sad", "blunt"], correct: "sad" },
            { before: "This box is", after: ". I can lift it up easily.", options: ["heavy", "blunt", "light"], correct: "light" }
        ];

        // ========== B.1 ANTONYMS (10) ==========
const b1Items = [
    { stem: "She likes to stay in a <strong>noisy</strong> place.", opts: ["quiet", "busy", "clean", "large"], correct: 0 },
    { stem: "John is waiting <strong>outside</strong> the room.", opts: ["behind", "inside", "beside", "near"], correct: 1 },
    { stem: "These two cars have the <strong>same</strong> color.", opts: ["bright", "new", "different", "shiny"], correct: 2 },
    { stem: "Peter is my <strong>friend</strong>.", opts: ["classmate", "teacher", "enemy", "cousin"], correct: 2 },
    { stem: "He did the sums <strong>correctly</strong>.", opts: ["carefully", "quickly", "neatly", "wrongly"], correct: 3 },
    { stem: "They are now at the <strong>top</strong> of the mountain.", opts: ["side", "bottom", "middle", "front"], correct: 1 },
    { stem: "He always <strong>forgets</strong> my name.", opts: ["remembers", "says", "writes", "hears"], correct: 0 },
    { stem: "Your father is <strong>angry</strong> with you.", opts: ["sad", "tired", "happy", "hungry"], correct: 2 },
    { stem: "The bag is very <strong>heavy</strong>.", opts: ["strong", "light", "big", "full"], correct: 1 },
    { stem: "The rabbit is <strong>fast</strong>.", opts: ["small", "slow", "white", "cute"], correct: 1 }
];

        // ========== RENDER FUNCTIONS ==========

        // Render MCQs A.1
        const mcContainer = document.getElementById('partAMC');
        function renderMC() {
            let html = '';
            mcqs.forEach((q, idx) => {
                html += `<div class="qcard"><span class="qnum">${idx+1}.</span> <span class="stem">${q.stem}</span>
                    <div class="ops">`;
                q.opts.forEach((opt, optIdx) => {
                    const letter = String.fromCharCode(97 + optIdx);
                    html += `<label><input type="radio" name="mc${idx}" value="${optIdx}"> ${letter}) ${opt}</label>`;
                });
                html += `</div><span class="fb" id="fbMC${idx}"></span></div>`;
            });
            mcContainer.innerHTML = html;
        }
        renderMC();

        // Render A2 Adjectives (dropdown)
        function renderA2() {
            const container = document.getElementById('a2Container');
            let html = '';
            a2Items.forEach((item, idx) => {
                html += `<div class="fill-item"><span class="qnum">${idx+1}.</span><div class="fill-content">
                    <span class="fill-text">${item.before}</span>
                    <span class="inline-input"><select id="a2_${idx}"><option value="">--</option>`;
                item.options.forEach(opt => html += `<option value="${opt}">${opt}</option>`);
                html += `</select></span>
                    <span class="fill-text">${item.after}</span>
                </div><span class="fill-feedback" id="fb_a2_${idx}"></span></div>`;
            });
            container.innerHTML = html;
        }
        renderA2();

        // Render B1 Antonyms (MCQ)
        function renderB1() {
            const container = document.getElementById('b1Container');
            let html = '';
            b1Items.forEach((q, idx) => {
                html += `<div class="qcard"><span class="qnum">${idx+1}.</span> <span class="stem">${q.stem}</span>
                    <div class="ops">`;
                q.opts.forEach((opt, optIdx) => {
                    const letter = String.fromCharCode(97 + optIdx);
                    html += `<label><input type="radio" name="b1${idx}" value="${optIdx}"> ${letter}) ${opt}</label>`;
                });
                html += `</div><span class="fb" id="fbB1${idx}"></span></div>`;
            });
            container.innerHTML = html;
        }
        renderB1();

        // ========== SCORING ==========
        function hitungSkor() {
            let skorA = 0;

            // A.1 MCQs (10)
            for (let i = 0; i < 10; i++) {
                const radios = document.getElementsByName(`mc${i}`);
                let selected = null;
                for (let r of radios) if (r.checked) { selected = r.value; break; }
                const fb = document.getElementById(`fbMC${i}`);
                if (selected !== null && parseInt(selected) === mcqs[i].correct) {
                    fb.innerText = '✓'; fb.className = 'fb correct'; skorA++;
                } else {
                    const benar = mcqs[i].opts[mcqs[i].correct];
                    const benarLetter = String.fromCharCode(97 + mcqs[i].correct);
                    fb.innerText = selected ? `✗ (${benarLetter}) ${benar}` : `(answer: ${benarLetter}) ${benar}`;
                    fb.className = 'fb wrong';
                }
            }

            // A.2 Adjectives (10)
            for (let i = 0; i < 10; i++) {
                const sel = document.getElementById(`a2_${i}`);
                const fb = document.getElementById(`fb_a2_${i}`);
                if (sel) {
                    const val = sel.value;
                    const benar = a2Items[i].correct;
                    if (val === benar) {
                        fb.innerText = '✓'; fb.className = 'fill-feedback correct'; sel.classList.add('correct'); skorA++;
                    } else {
                        fb.innerText = val ? `✗ (${benar})` : `(answer: ${benar})`;
                        fb.className = 'fill-feedback wrong'; sel.classList.remove('correct');
                        sel.classList.add('wrong');
                    }
                }
            }

            let skorB = 0;

            // B.1 Antonyms (10)
            for (let i = 0; i < 10; i++) {
                const radios = document.getElementsByName(`b1${i}`);
                let selected = null;
                for (let r of radios) if (r.checked) { selected = r.value; break; }
                const fb = document.getElementById(`fbB1${i}`);
                if (selected !== null && parseInt(selected) === b1Items[i].correct) {
                    fb.innerText = '✓'; fb.className = 'fb correct'; skorB++;
                } else {
                    const benar = b1Items[i].opts[b1Items[i].correct];
                    const benarLetter = String.fromCharCode(97 + b1Items[i].correct);
                    fb.innerText = selected ? `✗ (${benarLetter}) ${benar}` : `(answer: ${benarLetter}) ${benar}`;
                    fb.className = 'fb wrong';
                }
            }

            document.getElementById('scoreA').innerText = skorA;
            document.getElementById('scoreB').innerText = skorB;
            document.getElementById('scoreTotal').innerText = skorA + skorB;
            document.getElementById('scorePanel').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // ========== RESET ==========
        function resetSemua() {
            // Reset A.1 MCQs
            for (let i = 0; i < 10; i++) {
                const radios = document.getElementsByName(`mc${i}`);
                radios.forEach(r => r.checked = false);
                const fb = document.getElementById(`fbMC${i}`); if (fb) fb.innerText = '';
            }
            // Reset A.2
            for (let i = 0; i < 10; i++) {
                const sel = document.getElementById(`a2_${i}`);
                if (sel) { sel.value = ''; sel.classList.remove('correct', 'wrong'); }
                const fb = document.getElementById(`fb_a2_${i}`); if (fb) fb.innerText = '';
            }
            // Reset B.1
            for (let i = 0; i < 10; i++) {
                const radios = document.getElementsByName(`b1${i}`);
                radios.forEach(r => r.checked = false);
                const fb = document.getElementById(`fbB1${i}`); if (fb) fb.innerText = '';
            }
            document.getElementById('scoreA').innerText = '0';
            document.getElementById('scoreB').innerText = '0';
            document.getElementById('scoreTotal').innerText = '0';
        }

        document.getElementById('checkBtn').addEventListener('click', hitungSkor);
        document.getElementById('resetBtn').addEventListener('click', resetSemua);
    })();
</script>
</body>
</html>
