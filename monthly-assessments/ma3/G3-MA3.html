<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>G3 English Program Monthly Assessment 3</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #d0e2f2; font-family: 'Segoe UI', Roboto, sans-serif; padding: 10px 8px; display: flex; justify-content: center; }
        .paper { max-width: 750px; width: 100%; background: white; border-radius: 28px; box-shadow: 0 8px 25px rgba(0,30,60,0.2); padding: 18px 14px; }
        h1 { font-size: 1.7rem; color: #123b54; margin: 0 0 2px 5px; }
        .sub { font-size: 0.9rem; color: #34675c; margin-left: 8px; margin-bottom: 15px; }
        .score-panel { background: #e2edfb; border-radius: 40px; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; justify-content: space-between; margin-bottom: 20px; scroll-margin-top: 20px; }
        .score-item { background: white; border-radius: 30px; padding: 4px 14px; font-weight: 600; font-size: 0.9rem; color: #114b66; box-shadow: 0 1px 4px #b0c8dd; }
        .part { background: #f5faff; border-radius: 24px; padding: 18px 12px 22px; margin: 25px 0 18px; border: 1px solid #c0d6ed; }
        .part h2 { background: #205882; color: white; display: inline-block; padding: 5px 24px; border-radius: 40px; font-size: 1.3rem; margin-top: -34px; margin-bottom: 16px; }
        .grid-a { display: flex; flex-direction: column; gap: 12px; }
        .qcard { background: white; border-radius: 18px; padding: 12px 14px; border: 1px solid #d0e2f5; font-size: 0.95rem; }
        .qnum { font-weight: 700; color: #003f66; margin-right: 5px; }
        .stem { line-height: 1.4; }
        .ops { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px; }
        .ops label { background: #ecf3fc; padding: 4px 14px; border-radius: 30px; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
        .fb { margin-left: 8px; font-weight: 600; font-size: 0.9rem; }
        .fb.correct { color: #1f8b4c; }
        .fb.wrong { color: #c13a3a; }
        .fill-block { background: #fffcf0; border-radius: 24px; padding: 18px 16px; margin: 15px 0 10px; border: 2px solid #c0b28b; }
        .fill-item { margin: 20px 0; display: flex; align-items: flex-start; gap: 10px; flex-wrap: nowrap; }
        .fill-item .qnum { font-weight: 700; color: #003f66; min-width: 40px; font-size: 1rem; line-height: 1.5; flex-shrink: 0; }
        .fill-content { flex: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; line-height: 1.5; }
        .inline-input { display: inline-block; width: 160px; flex-shrink: 0; }
        .inline-input input, .inline-input select { width: 100%; padding: 8px 12px; border: 2px solid #5f8bb3; border-radius: 30px; font-size: 0.9rem; text-align: center; background: white; }
        .inline-input input.correct, .inline-input select.correct { background: #e3f7e3; border-color: #2a7f4a; }
        .fill-feedback { font-weight: 700; font-size: 0.9rem; min-width: 80px; text-align: right; flex-shrink: 0; }
        .fill-feedback.correct { color: #1f8b4c; }
        .fill-feedback.wrong { color: #c13a3a; }
        .section-title { font-weight: 600; margin: 20px 0 10px; font-size: 1.1rem; color: #205882; }
        .check-bottom { display: flex; justify-content: center; margin: 20px 0 8px; }
        .btn-large { background: #1e4e73; color: white; border: none; padding: 14px 30px; border-radius: 60px; font-size: 1.3rem; font-weight: 700; width: 100%; max-width: 300px; cursor: pointer; }
        .btn-small { background: white; border: 1px solid #2c6085; padding: 6px 16px; border-radius: 40px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
<div class="paper">
    <h1>📘 G3 Monthly Assessment 3</h1>
    <div class="sub">English Program | Grammar & Vocabulary</div>

    <div class="score-panel" id="scorePanel">
        <span class="score-item">Part A <span id="scoreA">0</span>/20</span>
        <span class="score-item">Part B <span id="scoreB">0</span>/10</span>
        <span class="score-item">Total <span id="scoreTotal">0</span>/30</span>
        <button class="btn-small" id="resetBtn">↺ Reset</button>
    </div>

    <!-- PART A: GRAMMAR -->
    <div class="part">
        <h2>🔹 PART A: Grammar</h2>
        <div class="section-title">A.1 Multiple Choice (1–10)</div>
        <div class="grid-a" id="partAMC"></div>
        <div class="section-title">A.2 Present Continuous (fill in the blanks)</div>
        <div class="fill-block" id="a2Container"></div>
    </div>

    <!-- PART B: VOCABULARY -->
    <div class="part">
        <h2>🔸 PART B: Vocabulary</h2>
        <div class="fill-block" id="b1Container"></div>
    </div>

    <div class="check-bottom">
        <button class="btn-large" id="checkBtn">🔍 Check Answers</button>
    </div>
</div>

<script>
    (function() {
        // ========== A.1 MULTIPLE CHOICE (10 soal) ==========
        const mcqs = [
            { stem: "Mr Lee ______ my neighbour.", opts: ["are", "is", "was", "were"], correct: 1 },
            { stem: "The pupils ______ in the hall.", opts: ["is", "was", "are", "am"], correct: 2 },
            { stem: "The woman ______ very happy.", opts: ["are", "were", "is", "am"], correct: 2 },
            { stem: "The teacher ______ very angry yesterday.", opts: ["is", "are", "were", "was"], correct: 3 },
            { stem: "My parents ______ born in Malaysia.", opts: ["was", "were", "is", "are"], correct: 1 },
            { stem: "Henry ______ milk every morning.", opts: ["drink", "drank", "drinks", "drinking"], correct: 2 },
            { stem: "I often ______ soccer with my friends.", opts: ["plays", "play", "played", "playing"], correct: 1 },
            { stem: "My father ______ a new car last Monday.", opts: ["buys", "buy", "bought", "buying"], correct: 2 },
            { stem: "I ______ my wallet yesterday.", opts: ["lose", "lost", "losing", "loses"], correct: 1 },
            { stem: "A pupil ______ just now.", opts: ["faint", "faints", "fainted", "fainting"], correct: 2 }
        ];

        // ========== A.2 Present Continuous (10 soal) ==========
const a2Items = [
    { before: "They", after: "butterflies now. (catch)", correct: "are catching" },
    { before: "Evelyn", after: "the violin now. (practise)", correct: "is practising" },
    { before: "Mr Noh", after: "the naughty boy now. (punish)", correct: "is punishing" },
    { before: "The boys", after: "television at the moment. (watch)", correct: "are watching" },
    { before: "Look! The dogs", after: "the cat. (chase)", correct: "are chasing" },
    { before: "Don't disturb me. I", after: ". (study)", correct: "am studying" },
    { before: "Be quiet! The babies", after: ". (sleep)", correct: "are sleeping" },
    { before: "Louise", after: "in the kitchen now. (cook)", correct: "is cooking" },
    { before: "Look at the water in the kettle. It", after: ". (boil)", correct: "is boiling" },
    { before: "Look at the birds. They", after: "in the sky. (fly)", correct: "are flying" }
];

        // ========== B.1 VOCABULARY (10 soal multiple choice) ==========
        const vocabItems = [
            { stem: "I drew a ______ of my parents.", opts: ["portrait", "painting", "photograph", "poster"], correct: 0 },
            { stem: "They start to ______ when the clowns go on stage.", opts: ["yawn", "laugh", "shout", "cry"], correct: 1 },
            { stem: "I ______ a letter to my friend in China.", opts: ["designed", "wrote", "signed", "planned"], correct: 1 },
            { stem: "He always puts a pen in his ______.", opts: ["collar", "neck", "pocket", "sleeve"], correct: 2 },
            { stem: "This morning I ate four ______ of bread.", opts: ["stacks", "pieces", "loaves", "crumbs"], correct: 1 },
            { stem: "Jimmy gave his mother a ______ of flowers on her birthday.", opts: ["pile", "bouquet", "box", "bundle"], correct: 1 },
            { stem: "That boy with a broken leg moves around in a ______.", opts: ["trishaw", "wheelchair", "tricycle", "bicycle"], correct: 1 },
            { stem: "A bear has very big and powerful ______.", opts: ["paws", "nails", "toes", "claws"], correct: 0 },
            { stem: "The baby sleeps in a ______.", opts: ["basket", "cradle", "bucket", "cage"], correct: 1 },
            { stem: "My uncle wears a ______ when it rains.", opts: ["helmet", "scarf", "raincoat", "glove"], correct: 2 }
        ];

        // Render MCQs
        const mcContainer = document.getElementById('partAMC');
        function renderMC() {
            let html = '';
            mcqs.forEach((q, idx) => {
                html += `<div class="qcard"><span class="qnum">${idx+1}.</span> <span class="stem">${q.stem}</span>
                    <div class="ops">`;
                q.opts.forEach((opt, optIdx) => {
                    const letter = String.fromCharCode(97 + optIdx);
                    html += `<label><input type="radio" name="mc${idx}" value="${optIdx}"> ${letter}) ${opt}</label>`;
                });
                html += `</div><span class="fb" id="fbMC${idx}"></span></div>`;
            });
            mcContainer.innerHTML = html;
        }
        renderMC();

        // Render A2 (present continuous fill in)
        function renderA2() {
            const container = document.getElementById('a2Container');
            let html = '';
            a2Items.forEach((item, idx) => {
                html += `<div class="fill-item"><span class="qnum">${idx+1}.</span><div class="fill-content">
                    <span class="fill-text">${item.before}</span>
                    <span class="inline-input"><input type="text" id="a2_${idx}" placeholder="verb + ing" autocomplete="off"></span>
                    <span class="fill-text">${item.after}</span>
                </div><span class="fill-feedback" id="fb_a2_${idx}"></span></div>`;
            });
            container.innerHTML = html;
        }
        renderA2();

        // Render B1 Vocabulary MCQ
        function renderB1() {
            const container = document.getElementById('b1Container');
            let html = '';
            vocabItems.forEach((q, idx) => {
                html += `<div class="qcard"><span class="qnum">${idx+1}.</span> <span class="stem">${q.stem}</span>
                    <div class="ops">`;
                q.opts.forEach((opt, optIdx) => {
                    const letter = String.fromCharCode(97 + optIdx);
                    html += `<label><input type="radio" name="vocab${idx}" value="${optIdx}"> ${letter}) ${opt}</label>`;
                });
                html += `</div><span class="fb" id="fbVocab${idx}"></span></div>`;
            });
            container.innerHTML = html;
        }
        renderB1();

        // ========== SCORING ==========
        function hitungSkor() {
            let skorA = 0;
            // MCQs A1 (10)
            for (let i = 0; i < 10; i++) {
                const radios = document.getElementsByName(`mc${i}`);
                let selected = null;
                for (let r of radios) if (r.checked) { selected = r.value; break; }
                const fb = document.getElementById(`fbMC${i}`);
                if (selected !== null && parseInt(selected) === mcqs[i].correct) {
                    fb.innerText = '✓'; fb.className = 'fb correct'; skorA++;
                } else {
                    const benar = mcqs[i].opts[mcqs[i].correct];
                    const benarLetter = String.fromCharCode(97 + mcqs[i].correct);
                    fb.innerText = selected ? `✗ (${benarLetter}) ${benar}` : `(answer: ${benarLetter}) ${benar}`;
                    fb.className = 'fb wrong';
                }
            }
            // A2 Present Continuous (10)
            for (let i = 0; i < 10; i++) {
                const inp = document.getElementById(`a2_${i}`);
                const fb = document.getElementById(`fb_a2_${i}`);
                if (inp) {
                    let val = inp.value.trim().toLowerCase().replace(/\s+/g, ' ');
                    const benar = a2Items[i].correct.toLowerCase();
                    if (val === benar) {
                        fb.innerText = '✓'; fb.className = 'fill-feedback correct'; inp.classList.add('correct'); skorA++;
                    } else {
                        fb.innerText = val ? `✗ ${a2Items[i].correct}` : `${a2Items[i].correct}`;
                        fb.className = 'fill-feedback wrong'; inp.classList.remove('correct');
                    }
                }
            }

            let skorB = 0;
            // Vocabulary (10)
            for (let i = 0; i < 10; i++) {
                const radios = document.getElementsByName(`vocab${i}`);
                let selected = null;
                for (let r of radios) if (r.checked) { selected = r.value; break; }
                const fb = document.getElementById(`fbVocab${i}`);
                if (selected !== null && parseInt(selected) === vocabItems[i].correct) {
                    fb.innerText = '✓'; fb.className = 'fb correct'; skorB++;
                } else {
                    const benar = vocabItems[i].opts[vocabItems[i].correct];
                    const benarLetter = String.fromCharCode(97 + vocabItems[i].correct);
                    fb.innerText = selected ? `✗ (${benarLetter}) ${benar}` : `(answer: ${benarLetter}) ${benar}`;
                    fb.className = 'fb wrong';
                }
            }

            document.getElementById('scoreA').innerText = skorA;
            document.getElementById('scoreB').innerText = skorB;
            document.getElementById('scoreTotal').innerText = skorA + skorB;
            document.getElementById('scorePanel').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function resetSemua() {
            for (let i = 0; i < 10; i++) {
                document.getElementsByName(`mc${i}`).forEach(r => r.checked = false);
                const fb = document.getElementById(`fbMC${i}`); if (fb) fb.innerText = '';
                const inp = document.getElementById(`a2_${i}`); if (inp) { inp.value = ''; inp.classList.remove('correct'); }
                const fb2 = document.getElementById(`fb_a2_${i}`); if (fb2) fb2.innerText = '';
                document.getElementsByName(`vocab${i}`).forEach(r => r.checked = false);
                const fbV = document.getElementById(`fbVocab${i}`); if (fbV) fbV.innerText = '';
            }
            document.getElementById('scoreA').innerText = '0';
            document.getElementById('scoreB').innerText = '0';
            document.getElementById('scoreTotal').innerText = '0';
        }

        document.getElementById('checkBtn').addEventListener('click', hitungSkor);
        document.getElementById('resetBtn').addEventListener('click', resetSemua);
    })();
</script>
</body>
</html>
